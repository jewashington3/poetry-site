<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <radialGradient id="warmGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d4a853" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#d4a853" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#0c0a08"/>
  <rect width="1200" height="1200" fill="url(#warmGlow)"/>

  <!-- Floating decorative circles (echo site aesthetic) -->
  <circle cx="140"  cy="180"  r="180" fill="#e07b3a" opacity="0.10"/>
  <circle cx="1060" cy="240"  r="130" fill="#7b4fa0" opacity="0.13"/>
  <circle cx="180"  cy="950"  r="160" fill="#9b2226" opacity="0.10"/>
  <circle cx="1040" cy="900"  r="140" fill="#d4a853" opacity="0.10"/>
  <circle cx="600"  cy="120"  r="70"  fill="#3a8a7a" opacity="0.10"/>
  <circle cx="920"  cy="580"  r="90"  fill="#c43e3e" opacity="0.08"/>

  <!-- Pretitle -->
  <text x="600" y="440" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="26" letter-spacing="10"
        fill="#d4a853">ORIGINAL WORKS BY</text>

  <!-- Name -->
  <text x="600" y="640" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="900" font-size="200"
        fill="#f0e6d2">JAMES</text>

  <!-- Gold rule -->
  <rect x="565" y="685" width="70" height="3" fill="#d4a853"/>

  <!-- Tagline -->
  <text x="600" y="770" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" font-size="36"
        fill="#b8a98e">Back with a vengeance &amp; perfected purpose</text>

  <!-- Bottom label -->
  <text x="600" y="900" text-anchor="middle"
        font-family="'Courier New', monospace"
        font-size="18" letter-spacing="5"
        fill="#7a6e5c">HANDWRITTEN POEMS  ·  2000–2003</text>

  <!-- Palette dots -->
  <circle cx="552" cy="945" r="6" fill="#e07b3a"/>
  <circle cx="576" cy="945" r="6" fill="#7b4fa0"/>
  <circle cx="600" cy="945" r="6" fill="#9b2226"/>
  <circle cx="624" cy="945" r="6" fill="#d4a853"/>
  <circle cx="648" cy="945" r="6" fill="#3a8a7a"/>
</svg>
